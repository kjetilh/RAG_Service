[orchestrator]
# Host path that maps to /data/uploads in rag_dimy_api container.
ingest_root = "/srv/ops/rag_service/uploads/dimy"
ingest_live_subdir = "cell_haven_docs_live"

# Documentation RAG admin endpoint.
admin_base_url = "http://127.0.0.1:8102"
admin_api_key_env = "RAG_DIMY_ADMIN_API_KEY"
request_timeout_sec = 120
fetch_coverage_actions = true

include_default = ["**/*.md", "**/*.markdown", "**/*.txt", "**/*.html", "**/*.htm", "**/*.pdf", "**/*.docx"]
exclude_default = ["**/.git/**", "**/.venv/**", "**/node_modules/**", "**/__pycache__/**", "**/.build/**", "**/.swiftpm/**"]

[[source]]
name = "CellProtocol"
repo_path = "/srv/ops/repos/CellProtocol"
source_type = "cellprotocol_docs"
target_subdir = "cellprotocol/CellProtocol"

[[source]]
name = "CellProtocolDocuments"
repo_path = "/srv/ops/repos/CellProtocolDocuments"
source_type = "haven_docs"
target_subdir = "cellprotocol/CellProtocolDocuments"

[[source]]
name = "CellScaffoldDocs"
repo_path = "/srv/ops/repos/CellScaffold"
repo_subpath = "Documentation"
source_type = "cellscaffold_internal_docs"
target_subdir = "cellscaffold/DocumentationCurated"
include = ["AIGatewayCell.md", "AIGatewayCell_Evaluation.md", "AdminCells.md", "FlowDebugProbeCell.md", "RAG_MVP_UI.md", "Skeleton*.md", "Porthole-and-skeleton.md", "Porthole_Menu_og_Skeleton_Paritet.md", "ConfigurationCatalog/*.md", "ServiceCatalog/*.md", "PromptPurposeLab/README.md", "PromptPurposeLab/Schema_Validation_Architecture.md"]
exclude = ["AIModelRuns/**", "Research/**", "TestData/**", "Operations/**", "PromptPurposeLab/generated/**", "PromptPurposeLab/Model_Download_Log_*.md", "ClaudeSkills/**", "Losningsforslag/**", "Mermaid/**", "ConfigurationCatalog/*.json", "ServiceCatalog/*.json", "*.json", "*.mmd", "*.original.md"]

[[source]]
name = "CellScaffoldPrompts"
repo_path = "/srv/ops/repos/CellScaffold"
source_type = "prompt_docs"
target_subdir = "cellprotocol/CellScaffoldPrompts"
include = ["**/*prompt*.md", "**/*Prompt*.md", "**/*.prompt", "prompts/**/*.md"]
exclude = ["Documentation/AIModelRuns/**", "Documentation/Research/**", "Documentation/TestData/**", "Documentation/Operations/**"]

[[source]]
name = "RAGServiceCellCompositionDocs"
repo_path = "/srv/ops/repos/RAG_Service"
source_type = "prompt_docs"
target_subdir = "RAG_Service/CellCompositionDocs"
include = ["docs/cell_composition/**/*.md"]
